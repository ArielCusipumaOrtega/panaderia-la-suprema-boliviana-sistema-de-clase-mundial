name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    name: Lint, Build & Test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check code formatting & linting (Backend & Frontend)
        run: npm run lint

      - name: Compile application (NestJS & Vue 3 Vite build)
        run: npm run build

      - name: Execute backend unit test suite
        run: npm test

      - name: Execute backend end-to-end (E2E) integration tests
        run: npm run test:e2e
